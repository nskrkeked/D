<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>드론 딜리버리</title>
<style>
:root{color-scheme:dark;--bg:#181923;--panel:#292b36;--edge:#090a10;--hi:#505361;--gold:#ffcf4a;--mint:#74efbd;--muted:#b3b6c3;--wood:#b77c40}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(ellipse at 50% 0,#343b4d 0,#181923 72%);color:#f5f2e9;font:17px/1.45 system-ui,"Malgun Gothic",sans-serif}.app{max-width:1080px;margin:auto}.brand{margin:0 0 12px;color:var(--gold);font:clamp(17px,3vw,27px)/1.35 monospace;text-shadow:3px 3px #714b12}.brand small{display:block;color:var(--muted);font:15px system-ui;text-shadow:none;margin-top:3px}.panel{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 4px 4px var(--hi),inset -4px -4px #171820}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 12px;margin-bottom:12px}.stat{min-width:0}.label{display:block;color:var(--muted);font:10px monospace;letter-spacing:.07em}.value{display:block;font:14px monospace;color:var(--mint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage{position:relative;background:#111;border:6px solid var(--edge);box-shadow:0 0 0 4px var(--hi),7px 9px #08090e}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:#111b}.overlay.hidden{display:none}.card{width:min(640px,100%);max-height:100%;overflow:auto;padding:clamp(13px,3vw,24px);text-align:center;background:#292b36;border:5px solid var(--edge);box-shadow:inset 4px 4px var(--hi),inset -4px -4px #171820}.tag{color:var(--mint);font:10px monospace;letter-spacing:.14em}.card h2{color:var(--gold);font-size:clamp(23px,5vw,39px);line-height:1.25;margin:8px 0}.card p{margin:8px 0}.how{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;text-align:left}.how div{padding:8px;background:#1a1c25;border:2px solid #484b59}.how b{color:var(--mint)}.learn{padding:9px 11px;margin:11px 0;background:#43351f;border:3px solid #8a642c;text-align:left;color:#fff0c3}.learn b{color:#ffe28c}.btn{border:3px solid #0e1016;background:#56a64a;box-shadow:inset 3px 3px #a4e583,inset -3px -3px #28652c;color:#fff;font:700 17px system-ui;padding:8px 15px;cursor:pointer}.btn:hover{filter:brightness(1.13)}.btn:disabled{filter:grayscale(.7);opacity:.65;cursor:not-allowed}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,.8fr);gap:12px;margin-top:13px}.fieldnote{padding:12px 14px;background:#ad783e;color:#211607;border:4px solid #67451e;box-shadow:inset 3px 3px #d29d57,inset -3px -3px #845a2b}.fieldnote strong{display:block;font:10px monospace;letter-spacing:.09em;color:#3e2a11}.fieldnote h3{margin:4px 0;font-size:19px}.fieldnote p{margin:3px 0}.shop{padding:12px}.shop h2{font:13px monospace;color:var(--gold);margin:0 0 8px}.shoprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #494b56}.shoprow div{font-size:14px}.shoprow small{display:block;color:var(--muted);font-size:12px}.shoprow .btn{font-size:13px;padding:6px 9px;white-space:nowrap}.controls{display:flex;gap:8px;justify-content:center;margin:12px 0}.controls .btn{width:62px;height:53px;padding:0;font:20px monospace}.help{margin:0 0 10px;color:var(--muted);font-size:13px}.tip{color:var(--muted);font-size:13px;margin:6px 0 0}@media(max-width:720px){body{padding:10px}.hud{grid-template-columns:repeat(3,1fr)}.columns{grid-template-columns:1fr}.how{grid-template-columns:1fr}.shoprow div{font-size:13px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body><main class="app">
<h1 class="brand">▣ 드론 딜리버리 <small>픽셀 도시를 누비며 배달하고, 번 돈으로 더 멀리 날아가세요!</small></h1>
<section class="hud panel" aria-label="게임 정보"><div class="stat"><span class="label">배달 횟수</span><span class="value" id="deliveries">0</span></div><div class="stat"><span class="label">콤보</span><span class="value" id="combo">x0</span></div><div class="stat"><span class="label">보유 코인</span><span class="value" id="coins">0</span></div><div class="stat"><span class="label">배터리</span><span class="value" id="battery">100%</span></div><div class="stat"><span class="label">기체 모델</span><span class="value" id="model">MARK I</span></div></section>
<div class="stage"><canvas id="game" width="480" height="270" aria-label="드론 딜리버리 게임 화면"></canvas><div class="overlay" id="overlay"><section class="card" id="card"></section></div></div>
<div class="columns"><aside class="fieldnote"><strong>ENGINEERING FIELD NOTE</strong><h3 id="lessonTitle">추력과 중력</h3><p id="lessonText"></p><p class="tip" id="flightTip">배달을 반복하며 공학 원리를 익혀 보세요.</p></aside><section class="shop panel"><h2>▣ 정비소 — 코인으로 업그레이드</h2><div id="shopItems"></div><p class="tip">부품을 살수록 드론의 프레임·색상·조명이 단계적으로 업그레이드됩니다.</p></section></div>
<div class="controls" aria-label="터치 조작"><button class="btn" data-key="left" aria-label="왼쪽 이동">◀</button><button class="btn" data-key="up" aria-label="상승">▲</button><button class="btn" data-key="down" aria-label="하강">▼</button><button class="btn" data-key="right" aria-label="오른쪽 이동">▶</button></div><p class="help">키보드: A / ← 왼쪽 · D / → 오른쪽 · W / ↑ 상승 · S / ↓ 하강 · R 다시 시작</p>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),W=480,H=270,G=244,keys={};
const lessons=[['추력과 중력','프로펠러가 만드는 추력이 중력보다 커야 드론이 올라갑니다. 화물을 더 실으면 필요한 추력도 커져요.','W/↑를 눌러 상승하고, 고도가 충분하면 잠시 놓아 배터리를 아껴 보세요.'],['관성과 제동','움직이는 물체는 계속 움직이려는 관성이 있습니다. 빠른 속도일수록 멈추는 데 더 많은 거리와 시간이 필요해요.','목표 지점에 도착하기 전에 반대쪽 방향키로 미리 감속하세요.'],['운동 에너지','운동 에너지는 ½mv²입니다. 속도가 두 배면 충돌 에너지는 네 배가 돼요.','건물과 새를 넉넉히 피해 안전한 경로를 잡아 보세요.'],['안정성과 제어','드론을 기울이면 추력의 일부가 옆 방향으로 향해 이동합니다. 조작을 급하게 바꾸면 기체가 흔들려요.','부드럽게 방향을 바꾸고 착륙 전에 속도를 낮추세요.'],['배터리와 효율','모터에 큰 추력을 오래 요구할수록 전력 소모가 커집니다. 배터리를 다 쓰면 기체가 멀쩡해도 운항을 끝내야 해요.','필요한 높이까지만 상승하고 코인을 모아 배터리를 업그레이드하세요.']];
let mode='title',tick=0,last=0,runTime=0,route=0,combo=0,coins=40,battery=100,maxBattery=100,life=3,invuln=0,flash=0,wind=0,drone,buildings=[],birds=[],clouds=[],modelParts=0,frameTier=0,upgrade={battery:0,motor:0,handling:0,style:0},deliveredTotal=0,routeClean=true,routeReward=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(n)=>{const a=Math.sin((n+1)*127.1+(route+11)*311.7)*43758.5453;return a-Math.floor(a)};
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function show(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hide(){ $('#overlay').classList.add('hidden') }
function saveProgress(){try{localStorage.setItem('droneDeliverySave',JSON.stringify({coins,deliveredTotal,upgrade,maxBattery}))}catch(e){}}
function loadProgress(){try{const s=JSON.parse(localStorage.getItem('droneDeliverySave')||'null');if(s){coins=Math.max(0,s.coins|0);deliveredTotal=Math.max(0,s.deliveredTotal|0);if(s.upgrade)upgrade=Object.assign(upgrade,s.upgrade);maxBattery=Math.max(100,s.maxBattery|0);battery=maxBattery}}catch(e){}}
function updateHud(){ $('#deliveries').textContent=deliveredTotal;$('#combo').textContent='x'+combo;$('#coins').textContent=coins;$('#battery').textContent=Math.ceil(battery)+'/'+maxBattery+'%';$('#model').textContent='MARK '+['I','II','III','IV','V','VI','VII','VIII'][Math.min(7,Math.max(0,modelParts))]; }
function showLesson(){const l=lessons[(route)%lessons.length];$('#lessonTitle').textContent=l[0];$('#lessonText').textContent=l[1];$('#flightTip').textContent=l[2]}
function setTitle(){mode='title';showLesson();show('<div class="tag">ENDLESS DELIVERY · PIXEL ARCADE</div><h2>드론 딜리버리</h2><p>끊임없이 배달을 이어가고 코인을 모아 드론을 업그레이드하세요!</p><div class="how"><div><b>W / ↑ 상승</b><br>필요한 높이까지만 올라가 배터리를 아껴요.</div><div><b>A·D / ← → 이동</b><br>가속 후 반대 방향으로 미리 감속해요.</div><div><b>S / ↓ 하강</b><br>목표 발판에 천천히 착륙하세요.</div><div><b>주의할 장애물</b><br>아파트와 규칙적으로 움직이는 새를 피하세요.</div></div><div class="learn"><b>플레이하며 배우는 공학</b><br>'+lessons[route%lessons.length][1]+'</div><p>배달 성공 보상과 연속 콤보로 코인을 벌어요. 업그레이드와 배터리 관리를 잊지 마세요.</p><button class="btn" data-action="start">게임 시작 ▶</button>')}
function buildRoute(){buildings=[];birds=[];clouds=[];const difficulty=route;const count=Math.min(6,2+Math.floor(difficulty/2));for(let i=0;i<count;i++){const slot=310/count,x=91+i*slot+slot*.5;const height=35+rand(i+41)*Math.min(110,55+difficulty*5);buildings.push({x:Math.round(x),w:22+Math.floor(rand(i+87)*18),h:Math.round(height),shade:i%3})}const numBirds=Math.min(8,1+Math.floor(difficulty/2));for(let i=0;i<numBirds;i++){const y=38+rand(i+200)*135;birds.push({x:75+rand(i+330)*325,y,base:y,v:(rand(i+44)<.5?-1:1)*(18+difficulty*2.7+rand(i+61)*16),phase:rand(i+31)*6.28,amp:7+rand(i+95)*16,style:i%3,dive:0,cool:2+rand(i+50)*5})}for(let i=0;i<6;i++)clouds.push({x:rand(i+100)*500,y:10+rand(i+114)*64,w:28+rand(i+120)*36,s:4+rand(i+130)*7});wind=(rand(902)-.5)*Math.min(17,2+route*1.2);}
function beginRoute(){buildRoute();drone={x:38,y:G-15,vx:0,vy:0,tilt:0,thrust:0};battery=Math.min(maxBattery,battery+Math.floor(maxBattery*.30));life=3;invuln=0;runTime=0;routeClean=true;mode='play';hide();showLesson();updateHud()}
function title(){setTitle()}
function buy(kind){const price=kind==='battery'?40+upgrade.battery*35:kind==='motor'?55+upgrade.motor*45:kind==='handling'?45+upgrade.handling*40:65+upgrade.style*65;if(coins<price)return;coins-=price;upgrade[kind]++;modelParts++;if(kind==='battery'){maxBattery+=25;battery=Math.min(maxBattery,battery+25)}else if(kind==='motor'){/* improved acceleration and top speed */}else if(kind==='handling'){/* faster control response */}else frameTier++;saveProgress();renderShop();updateHud()}
function renderShop(){const items=[['battery','배터리 팩','최대 배터리 +25%'],['motor','모터 튜닝','이동 속도·추력 향상'],['handling','비행 컨트롤러','방향 전환이 더 빠르고 안정적'],['style','외관 프레임','새 프레임·색상·조명 잠금 해제']];$('#shopItems').innerHTML=items.map(([id,name,desc])=>{const price=id==='battery'?40+upgrade.battery*35:id==='motor'?55+upgrade.motor*45:id==='handling'?45+upgrade.handling*40:65+upgrade.style*65;let level=upgrade[id];return '<div class="shoprow"><div><b>'+name+' · Lv.'+level+'</b><small>'+desc+'</small></div><button class="btn" data-buy="'+id+'">'+price+' 코인</button></div>'}).join('')}
function gameOver(reason){if(mode!=='play')return;mode='over';combo=0;saveProgress();updateHud();show('<div class="tag">DELIVERY RUN ENDED</div><h2>운항 종료</h2><p>'+reason+'</p><div class="learn"><b>공학 복습 · '+lessons[route%lessons.length][0]+'</b><br>'+lessons[route%lessons.length][1]+'</div><p>보유 코인과 구매한 업그레이드는 저장돼요.</p><button class="btn" data-action="retry">다시 출발 ↻</button>')}
function successfulLanding(){if(mode!=='play')return;mode='delivery';const base=24+Math.min(route,40);const comboBonus=combo*6;const cleanBonus=routeClean?12:0;routeReward=base+comboBonus+cleanBonus;coins+=routeReward;combo++;route++;deliveredTotal++;battery=Math.min(maxBattery,battery+Math.floor(maxBattery*.20));saveProgress();updateHud();showLesson();show('<div class="tag">DELIVERY COMPLETE · COMBO x'+combo+'</div><h2>배달 성공! +'+routeReward+' 코인</h2><p>'+(routeClean?'노히트 보너스 +12 포함! ':'')+'연속 배달 콤보로 다음 보상이 더 커져요.</p><div class="learn"><b>공학 포인트 · '+lessons[(route-1)%lessons.length][0]+'</b><br>'+lessons[(route-1)%lessons.length][1]+'<br><br><b>생각해 보기:</b> 이번 비행에서 속도를 줄이기 가장 좋은 시점은 언제였나요?</div><p>정비소에서 업그레이드한 뒤 다음 배달을 시작하세요.</p><button class="btn" data-action="next">다음 배달 ▶</button>')}
function hit(kind){if(invuln>0||mode!=='play')return;life--;routeClean=false;invuln=1.35;drone.vx+=(drone.x<240?-1:1)*38;drone.vy=-38;flash=.16;if(life<=0)gameOver(kind==='bird'?'새와 여러 번 충돌했어요.':kind==='building'?'건물과 충돌해 기체가 손상됐어요.':'안전 착륙에 실패했어요.');updateHud()}
function update(dt){tick+=dt;for(const c of clouds){c.x+=c.s*dt;if(c.x>500)c.x=-c.w}for(const b of birds){b.cool-=dt;if(b.style===2&&b.cool<=0&&mode==='play'&&Math.abs(drone.x-b.x)<105&&Math.abs(drone.y-b.y)<95){b.dive=1.05;b.cool=4.5+rand(Math.floor(tick+b.x))*3}if(b.dive>0){b.y+=115*dt;b.x+=b.v*.65*dt;b.dive-=dt;if(b.dive<=0){b.dive=0;b.base=clamp(b.y,35,190);b.v*=-1}}else{b.x+=b.v*dt;b.y=b.base+Math.sin(tick*1.7+b.phase)*b.amp}if(b.x<15){b.x=15;b.v=Math.abs(b.v)}if(b.x>465){b.x=465;b.v=-Math.abs(b.v)}}if(mode!=='play')return;runTime+=dt;invuln=Math.max(0,invuln-dt);const d=drone;const side=(keys.right?1:0)-(keys.left?1:0);const vertical=(keys.down?1:0)-(keys.up?1:0);const motor=1+upgrade.motor*.16,handling=1+upgrade.handling*.2;const maxSpeed=70+upgrade.motor*12;d.vx=clamp(d.vx+(side*(95+upgrade.motor*7)*handling+wind-d.vx*(1.15+upgrade.handling*.12))*dt,-maxSpeed,maxSpeed);const targetVy=vertical===-1?-54- upgrade.motor*5:vertical===1?64:9;d.vy+=(targetVy-d.vy)*(1-Math.exp(-dt*(2.1+upgrade.handling*.16)));d.x+=d.vx*dt;d.y+=d.vy*dt;d.x=clamp(d.x,12,468);d.y=clamp(d.y,10,G-13);d.tilt=clamp(d.vx*.008,-.25,.25);const effort=keys.up?1.5:keys.down?.75:.65;battery-=dt*effort*(1+route*.012)/(1+upgrade.motor*.035);if(battery<=0){battery=0;updateHud();gameOver('배터리가 완전히 소진됐어요. 업그레이드하거나 상승을 줄여 더 멀리 가 보세요.');return}if(flash>0)flash-=dt;
for(const b of buildings){const top=G-b.h;if(d.x+9>b.x&&d.x-9<b.x+b.w&&d.y+9>top){hit('building');if(mode!=='play')return;d.x=d.x<b.x?b.x-11:b.x+b.w+11;d.vx*=.35}}
for(const b of birds){if(Math.abs(d.x-b.x)<14&&Math.abs(d.y-b.y)<11){hit('bird');if(mode!=='play')return;b.v*=-1;b.x+=b.v>0?16:-16}}
// Ground is dangerous except at the destination pad; a soft, slow touchdown earns a delivery.
if(d.y>=G-14){if(d.x>=420&&Math.abs(d.vx)<34&&Math.abs(d.vy)<46){successfulLanding();return}if(d.x>=420){hit('landing');if(mode!=='play')return;d.y=G-16;d.vy=-45}else{d.y=G-14;d.vy=-Math.abs(d.vy)*.2;if(Math.abs(d.vy)>105)hit('landing')}}if(d.x>456){d.x=456;d.vx=-Math.abs(d.vx)*.35}updateHud()}
function draw(){const sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,'#52a9f2');sky.addColorStop(1,'#c7e9ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);rect(0,0,W,G,'#83c8f5');rect(0,G,W,H-G,'#79512c');for(let i=0;i<9;i++){let bx=i*58,bh=23+(i*29%34);rect(bx,G-bh,39,bh,'#77899c');for(let yy=G-bh+7;yy<G-4;yy+=12){rect(bx+7,yy,5,5,'#c6d9e7');rect(bx+22,yy,5,5,'#c6d9e7')}}for(const c of clouds){rect(c.x,c.y,c.w,7,'#fff');rect(c.x+7,c.y-5,c.w*.48,6,'#fff');rect(c.x,c.y+6,c.w,2,'#d7e9f5')}
for(const b of buildings){const top=G-b.h;const pal=['#965b42','#8b6349','#6e6c83'][b.shade];rect(b.x,top,b.w,b.h,pal);rect(b.x-2,top,b.w+4,5,'#c49661');rect(b.x+b.w-4,top+4,4,b.h-4,'rgba(0,0,0,.2)');for(let yy=top+11;yy<G-6;yy+=15)for(let xx=b.x+4;xx<b.x+b.w-4;xx+=10){rect(xx,yy,5,7,'#f8d36d');rect(xx,yy+7,5,2,'#694631')}}rect(0,G,W,6,'#4e9d39');for(let i=0;i<72;i++)rect((i*37)%480,G+(i%5),3,2,i%2?'#62b847':'#34782e');
// delivery platform, beacon, and route label
rect(415,G-4,54,4,'#f5d348');rect(415,G-8,3,7,'#f5d348');rect(466,G-8,3,7,'#f5d348');rect(443,G-37,2,30,'#d9e5e9');rect(445,G-37,22,10,'#4dd77c');rect(445,G-32,14,5,'#fff');ctx.font='10px monospace';ctx.fillStyle='#18273a';ctx.fillText('DROP-OFF',411,G-44);
for(const b of birds){ctx.save();ctx.translate(Math.round(b.x),Math.round(b.y));ctx.scale(b.v<0?-1:1,1);const flap=Math.floor(tick*9+b.phase)%2;rect(-6,-2,12,5,'#3b3e4b');rect(5,-3,5,4,'#3b3e4b');rect(10,-2,4,2,'#eaa248');rect(-3,flap?-7:2,8,5,'#586275');rect(-8,0,3,2,'#292d38');rect(6,-2,1,1,'#fff');ctx.restore()}
// draw progressively upgraded drone: chassis, colored armor, additional pods, lights, and propellers.

function bindKey(e,down){const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};if(map[e.key]){keys[map[e.key]]=down;e.preventDefault()}if(!down)return;if(e.key==='r'||e.key==='R'){if(mode==='over'||mode==='title')setTitle()}if(e.key==='Enter'){if(mode==='title')beginRoute();else if(mode==='delivery')beginRoute();else if(mode==='over')beginRoute()}}
