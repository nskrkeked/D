<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Drone Lab</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'VT323', monospace; 
      letter-spacing: 1px;
    }
    canvas { 
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
      background-color: #7dd3fc; /* 💡 캔버스 기본 배경색 지정 (검은 화면 방지) */
    }
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen flex flex-col lg:flex-row overflow-hidden select-none">

  <main class="flex-1 flex flex-col items-center justify-center p-4 lg:p-6 bg-slate-900 relative">
    
    <div class="w-full max-w-5xl aspect-video bg-sky-300 border-4 border-slate-700 shadow-[8px_8px_0px_0px_rgba(0,0,0,0.8)] relative flex items-center justify-center overflow-hidden">
      
      <canvas id="gameCanvas" width="800" height="450" class="w-full h-full object-contain"></canvas>

      <div class="scanlines absolute inset-0 pointer-events-none z-10"></div>

      <div id="startGuide" class="absolute bottom-3 left-3 bg-black/80 border-2 border-slate-600 px-3 py-1.5 text-base text-yellow-400 z-20 animate-pulse">
        ▶ 방향키나 [W/A/D]를 누르면 시동이 걸립니다!
      </div>

      <div id="resultModal" class="hidden absolute inset-0 bg-black/80 flex items-center justify-center z-30">
        <div class="bg-slate-800 border-4 border-slate-600 p-6 max-w-md w-full shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] text-center">
          <h2 id="modalTitle" class="text-4xl font-bold mb-2 tracking-wider">MISSION COMPLETE</h2>
          <p id="modalSub" class="text-slate-300 text-lg mb-4">안전하게 배달을 완료했습니다!</p>
          
          <div class="bg-black border-2 border-slate-700 p-3 mb-5 text-left text-lg">
            <div class="flex justify-between">
              <span class="text-slate-400">수직 속도 (Vy):</span>
              <span id="logVy" class="text-green-400">0.0 m/s</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">수평 속도 (Vx):</span>
              <span id="logVx" class="text-green-400">0.0 m/s</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">착륙 각도:</span>
              <span id="logAngle" class="text-green-400">0.0°</span>
            </div>
          </div>

          <button id="retryBtn" class="bg-green-600 hover:bg-green-500 text-black border-2 border-black font-bold px-6 py-2 text-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-1 active:translate-y-1 active:shadow-none">
            NEXT LEVEL
          </button>
        </div>
      </div>

    </div>
  </main>

  <aside class="w-full lg:w-96 bg-slate-900 border-t-4 lg:border-t-0 lg:border-l-4 border-slate-700 p-6 flex flex-col gap-5 justify-between">
    <div class="flex flex-col gap-4">
      <header>
        <h1 class="text-4xl font-bold text-sky-400 tracking-wider">PIXEL DRONE</h1>
        <p class="text-slate-400 text-lg">:: ROOFTOP DELIVERY LAB ::</p>
      </header>

      <section class="bg-black border-2 border-slate-700 p-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.5)]">
        <h3 class="text-yellow-400 font-bold mb-2 text-lg">📟 TELEMETRY DATA</h3>
        <div class="grid grid-cols-2 gap-3 text-xl">
          <div>
            <span class="text-slate-400 text-xs block">STAGE LEVEL</span>
            <span id="uiLevel" class="text-green-4
