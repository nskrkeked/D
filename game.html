<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>픽셀 드론 구조대</title>
<style>
:root{color-scheme:dark;--bg:#171923;--panel:#292c38;--edge:#090b12;--gold:#ffd34e;--mint:#6cf0ba;--text:#f4f2e8;--muted:#b8bdc9;--wood:#b47c3e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#343b4e,#171923 70%);color:var(--text);font:18px/1.5 system-ui,"Malgun Gothic",sans-serif;min-height:100vh;padding:18px}.wrap{max-width:980px;margin:auto}.brand{font:clamp(16px,3vw,26px)/1.5 monospace;color:var(--gold);text-shadow:3px 3px #714b12;margin:0 0 12px}.brand small{display:block;color:var(--muted);font:16px system-ui;text-shadow:none}.frame{border:6px solid var(--edge);box-shadow:0 0 0 4px #555966,8px 10px 0 #090b12;background:#111;position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:#10131bd9}.overlay.off{display:none}.card{width:min(650px,100%);max-height:100%;overflow:auto;background:#292c38;border:5px solid #090b12;box-shadow:inset 4px 4px #555966,inset -4px -4px #171923;padding:clamp(12px,3vw,26px);text-align:center}.tag{font:11px monospace;letter-spacing:.13em;color:var(--mint)}h2{font-size:clamp(24px,5vw,40px);margin:7px 0;color:var(--gold);line-height:1.3}.card p{margin:8px 0}.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:16px 0}.how div,.lesson{background:#1b1e27;border:2px solid #474b58;padding:9px}.how b{color:var(--mint)}.lesson{border-color:#8b6527;background:#42351f;text-align:left;margin:12px 0}.lesson b{color:#ffe28c}.btn{border:3px solid #101117;background:#53a84a;box-shadow:inset 3px 3px #a4e583,inset -3px -3px #28652c;color:white;font:700 20px system-ui;padding:9px 24px;cursor:pointer}.btn:hover{filter:brightness(1.13)}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#292c38;border:4px solid #090b12;padding:9px 12px;margin:12px 0}.hud span{color:var(--mint)}.lower{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.note{background:#ad783e;color:#211607;border:4px solid #67451e;padding:10px 14px}.note strong{display:block;font:11px monospace;letter-spacing:.08em}.note p{margin:4px 0}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:5px}.controls button{height:48px;font-size:20px;padding:0}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.help{font-size:14px;color:var(--muted);margin:8px 2px}.hide{display:none!important}@media(max-width:600px){body{padding:10px}.how{grid-template-columns:1fr}.lower{grid-template-columns:1fr}.controls{justify-self:center;grid-template-columns:repeat(4,58px)}.controls button:nth-child(n){grid-column:auto;grid-row:auto}}
</style>
</head>
<body><main class="wrap">
<h1 class="brand">▣ PIXEL DRONE RESCUE <small>픽셀 세계에서 배우는 드론 비행과 공학</small></h1>
<div class="frame"><canvas id="game" width="480" height="270" aria-label="픽셀 드론 게임"></canvas><div class="overlay" id="overlay"><section class="card" id="card"></section></div></div>
<div class="hud"><div>스테이지 <span id="stage">1</span></div><div>구조 하트 <span id="life">♥ ♥ ♥</span></div><div>배터리 <span id="battery">100%</span></div><div>배달 <span id="score">0</span></div></div>
<div class="lower"><aside class="note"><strong>ENGINEERING FIELD NOTE</strong><div id="lessonTitle">추력과 중력</div><p id="lessonText">프로펠러 추력이 중력보다 커야 드론이 올라가요. 배달 상자가 무거워지면 필요한 추력도 커집니다.</p></aside><div class="controls" aria-label="터치 조작"><button class="btn" data-key="up" aria-label="상승">▲</button><button class="btn" data-key="left" aria-label="왼쪽">◀</button><button class="btn" data-key="down" aria-label="하강">▼</button><button class="btn" data-key="right" aria-label="오른쪽">▶</button></div></div>
<p class="help">키보드: ↑/W 상승 · ↓/S 하강 · ←/A, →/D 이동 · Enter 시작/계속 · R 재시작</p>
</main>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),x=c.getContext('2d'),$=s=>document.querySelector(s),W=480,H=270,ground=246;
let state='title',level=1,life=3,score=0,battery=100,time=0,last=0,drone,buildings=[],birds=[],clouds=[],keys={},lessonIndex=0,notice='';
const lessons=[['추력과 중력','프로펠러 추력이 중력보다 커야 드론이 올라가요. 배달 상자가 무거워지면 필요한 추력도 커집니다.'],['관성과 제동','움직이는 물체는 계속 움직이려 해요. 목표 지점에 닿기 전에 반대 방향으로 움직여 속도를 줄여 보세요.'],['운동 에너지','충돌 에너지는 ½mv²입니다. 속도가 두 배면 충격은 네 배! 건물과 새를 여유 있게 피해요.'],['안정성과 무게중심','기울어진 드론은 옆으로 가속해요. 화물이 흔들린다고 상상하며 부드럽게 조종하고 착륙 때 수평을 맞추세요.'],['배터리와 효율','높이 오래 날수록 전기를 더 써요. 필요한 만큼만 상승하고 경로를 미리 골라 효율적으로 비행하세요.']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(n)=>{let z=Math.sin(n*127.1+level*311.7)*43758.5453;return z-Math.floor(z)};
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function lesson(){let l=lessons[(level-1)%lessons.length];$('#lessonTitle').textContent=l[0];$('#lessonText').textContent=l[1]}
function show(html){$('#card').innerHTML=html;$('#overlay').classList.remove('off')}
function hide(){ $('#overlay').classList.add('off') }
function makeWorld(){buildings=[];birds=[];clouds=[];let count=Math.min(6,1+Math.floor(level/2));for(let i=0;i<count;i++){let bx=104+i*(280/count),bh=35+rand(i+9)*Math.min(105,50+level*7);buildings.push({x:Math.round(bx),w:22+Math.floor(rand(i+21)*20),h:Math.round(bh)})}let nb=Math.min(7,1+Math.floor(level/2));for(let i=0;i<nb;i++){let dir=rand(i+44)<.5?-1:1;let y=45+rand(i+90)*110;birds.push({x:80+rand(i+70)*320,y,base:y,v:dir*(20+level*3+rand(i+4)*15),phase:rand(i+17)*6.28,amp:8+rand(i+33)*14,turn:0,pattern:i%3})}for(let i=0;i<5;i++)clouds.push({x:rand(i+121)*480,y:15+rand(i+141)*55,w:30+rand(i+151)*28,s:3+rand(i+161)*5})}
function resetDrone(){drone={x:42,y:ground-16,vx:0,vy:0,tilt:0}}
function start(){lesson();makeWorld();resetDrone();battery=100;life=3;time=0;state='play';hide();updateHud()}
function title(){state='title';show('<div class="tag">ARCADE FLIGHT SCHOOL · 1 PLAYER</div><h2>픽셀 드론 구조대</h2><p>아파트 사이를 날아 구조 상자를 안전하게 배달하세요!</p><div class="how"><div><b>▲ 상승</b><br>추력으로 고도를 올려요.</div><div><b>◀ ▶ 이동</b><br>관성을 생각해 미리 감속!</div><div><b>▼ 하강</b><br>도착 발판에 천천히 착륙.</div><div><b>새 주의!</b><br>새는 무리 지어 날고, 급강하하기도 해요.</div></div><div class="lesson"><b>오늘의 공학 한 줄 · '+lessons[(level-1)%lessons.length][0]+'</b><br>'+lessons[(level-1)%lessons.length][1]+'</div><p>스테이지가 오를수록 건물·새·바람이 늘고 배달 상자는 무거워집니다.</p><button class="btn" data-action="start">게임 시작 ▶</button>')}
function finish(win){state=win?'win':'over';if(win){score++;show('<div class="tag">DELIVERY COMPLETE</div><h2>안전 배달 성공!</h2><p>'+lessons[(level-1)%lessons.length][0]+' 원리를 써서 무사히 착륙했어요.</p><div class="lesson"><b>생각해 보기</b><br>착륙 전에 속도를 줄이지 않았다면 어떤 일이 생겼을까요?</div><button class="btn" data-action="next">다음 스테이지 ▶</button>')}else{show('<div class="tag">FLIGHT ENDED</div><h2>비행을 다시 준비해요</h2><p>충돌을 피하고 배터리를 확인한 뒤, 속도를 줄여 발판에 착륙하세요.</p><div class="lesson"><b>공학 복습</b><br>'+lessons[(level-1)%lessons.length][1]+'</div><button class="btn" data-action="retry">다시 도전 ↻</button>')}}
function updateHud(){$('#stage').textContent=level;$('#life').textContent='♥ '.repeat(life)||'0';$('#battery').textContent=Math.ceil(battery)+'%';$('#score').textContent=score}
function hit(){life--;drone.vx*=-.45;drone.vy=-35;if(life<=0)finish(false)}
function update(dt){time+=dt;for(let b of birds){b.turn=Math.max(0,b.turn-dt);if(b.pattern===2&&b.turn===0&&Math.abs(drone.x-b.x)<95&&Math.abs(drone.y-b.y)<90){b.turn=2.8;b.dive=1}if(b.dive){b.y+=115*dt;b.x+=b.v*dt*.55;b.dive-=dt;if(b.dive<=0){b.dive=0;b.base=clamp(b.y,38,190);b.v*=-1}}else{b.x+=b.v*dt;b.y=b.base+Math.sin(time*1.7+b.phase)*b.amp}if(b.x<-18){b.x=-18;b.v=Math.abs(b.v)}if(b.x>498){b.x=498;b.v=-Math.abs(b.v)}}for(let q of clouds){q.x+=q.s*dt*(1+level*.015);if(q.x>500)q.x=-q.w}
if(state!=='play')return;
let d=drone,thrust=keys.up?1:keys.down?-.38:0,side=(keys.right?1:0)-(keys.left?1:0),wind=Math.sin(time*.7)*Math.min(13,level*1.4);d.vx+= (side*92+wind-d.vx*1.15)*dt;d.vy+=(-thrust*125+38-d.vy*.42)*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.x=clamp(d.x,12,468);d.y=clamp(d.y,12,ground-14);d.tilt=clamp(d.vx*.008,-.25,.25);battery-=dt*(.45+Math.max(0,thrust)*1.45)*(1+level*.025);if(battery<=0){battery=0;finish(false);return}
// Tower collisions: top and sides are hazards.
for(let b of buildings){let top=ground-b.h;if(d.x+10>b.x&&d.x-10<b.x+b.w&&d.y+10>top){hit();if(state!=='play')return;d.x=d.x<b.x?b.x-12:b.x+b.w+12}}
for(let b of birds){if(Math.abs(d.x-b.x)<16&&Math.abs(d.y-b.y)<13){hit();if(state!=='play')return;b.v*=-1;b.x+=b.v>0?20:-20}}
// Ground landing only succeeds on the destination pad and at safe speed.
if(d.y>=ground-14){if(d.x>427&&d.vx<34&&d.vy<52){finish(true);return}if(d.x>427){finish(false);return}d.y=ground-14;d.vy=Math.min(0,-Math.abs(d.vy)*.18);if(Math.abs(d.vy)>100)hit()}
if(d.x>454&&d.y<ground-20){d.x=454;d.vx=-Math.abs(d.vx)*.35}
updateHud()}
function draw(){// Minecraft-like chunky sky, city, grass and sprites
let grad=x.createLinearGradient(0,0,0,ground);grad.addColorStop(0,'#52a9f2');grad.addColorStop(1,'#c7e9ff');x.fillStyle=grad;x.fillRect(0,0,W,H);rect(0,0,W,ground,'#83c8f5');rect(0,ground,W,H-ground,'#76502c');for(let i=0;i<100;i++){let px=(i*67)%480,py=ground+7+(i*19)%22;rect(px,py,3,3,i%2?'#8a6034':'#654326')}for(let q of clouds){rect(q.x,q.y,q.w,7,'#fff');rect(q.x+6,q.y-5,q.w*.48,6,'#fff');rect(q.x,q.y+6,q.w,2,'#d7e9f5')}
// distant block skyline
for(let i=0;i<12;i++){let bx=i*45,bh=22+(i*31%38);rect(bx,ground-bh,35,bh,'#8294a8');rect(bx+5,ground-bh+7,5,6,'#d9e8f1');rect(bx+18,ground-bh+7,5,6,'#d9e8f1')}
for(let b of buildings){let top=ground-b.h;rect(b.x,top,b.w,b.h,'#9b6244');rect(b.x-2,top,b.w+4,5,'#c39462');for(let yy=top+10;yy<ground-6;yy+=14)for(let xx=b.x+4;xx<b.x+b.w-4;xx+=10){rect(xx,yy,5,7,'#f8d36d');rect(xx,yy+7,5,2,'#70442f')}rect(b.x,ground-4,b.w,4,'#604633')}
// ground grass and marked landing pad
rect(0,ground,W,6,'#4e9d39');for(let i=0;i<70;i++)rect((i*37)%480,ground+(i%5),3,2,i%2?'#62b847':'#34782e');rect(424,ground-4,48,4,'#f6d84a');rect(424,ground-7,3,6,'#f6d84a');rect(469,ground-7,3,6,'#f6d84a');
for(let b of birds){let flap=Math.floor(time*9+b.phase)%2;let dir=b.v<0?-1:1;x.save();x.translate(Math.round(b.x),Math.round(b.y));x.scale(dir,1);rect(-5,-2,11,5,'#414456');rect(5,-3,4,4,'#414456');rect(9,-2,4,2,'#f0a648');rect(-2,flap?-7:2,7,5,'#626b82');rect(-7,0,3,2,'#303342');rect(6,-2,1,1,'#fff');x.restore()}
// parcel landing marker
rect(446,ground-34,2,26,'#d9e5e9');rect(448,ground-34,16,10,'#4dd77c');rect(448,ground-29,9,5,'#fff');
// drone and parcel
let d=drone||{x:42,y:ground-16,tilt:0};x.save();x.translate(Math.round(d.x),Math.round(d.y));x.rotate(d.tilt||0);rect(-15,-7,30,3,'#333844');rect(-18,-10,8,2,'#eaf3f7');rect(10,-10,8,2,'#eaf3f7');rect(-9,-5,18,9,'#d9e0e6');rect(-5,-3,10,5,'#59d2d5');rect(-3,4,6,5,'#424857');rect(-7,9,14,2,'#222630');rect(-4,6,8,6,'#ad7135');rect(-3,7,6,1,'#e2a858');x.restore();
// simple wind and level label
x.font='10px monospace';x.fillStyle='#243043';x.fillText('WIND '+(Math.sin(time*.7)*level).toFixed(1),8,16);x.fillText('LEVEL '+level,408,16);if(state==='play'&&notice){x.fillStyle='#fff';x.fillText(notice,170,25)}}
function loop(ts){requestAnimationFrame(loop);let dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;if(state==='play')update(dt);draw()}
document.addEventListener('keydown',e=>{let map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.key==='Enter'){if(state==='title')start();else if(state==='win'){level++;title()}else if(state==='over')start()}if(e.key==='r'||e.key==='R')title()});document.addEventListener('keyup',e=>{let map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key])keys[map[e.key]]=false});document.querySelectorAll('[data-key]').forEach(btn=>{let k=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;btn.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>keys[k]=false))});$('#card').addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(a==='start'||a==='retry')start();if(a==='next'){level++;title()}});lesson();resetDrone();updateHud();title();requestAnimationFrame(loop);
})();
</script></body></html>
